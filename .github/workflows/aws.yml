name: Deploy to Amazon ECS

on:
  pull_request:
    types: [closed]
    branches: ["deploy-backend", "deploy-fontend"]

jobs:
  deploy-frontend:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'deploy-fontend'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Frontend via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.FRONTEND_HOST }}
          username: ${{ secrets.FRONTEND_USER }}
          key: ${{ secrets.FRONTEND_SSH_KEY }}
          script: |
            set -e
            cd /var/www/html/CommentSystemMERN/

            git fetch origin deploy-fontend
            git reset --hard origin/deploy-fontend

            export NVM_DIR="$HOME/.nvm"
            source "$NVM_DIR/nvm.sh"

            cd fontend
            npm ci
            npm run build

            pm2 restart Fontend || pm2 start npm --name "Fontend" -- run preview
            pm2 save

  deploy-backend:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'deploy-backend'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Backend via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.BACKEND_HOST }}
          username: ${{ secrets.FRONTEND_USER }}
          key: ${{ secrets.FRONTEND_SSH_KEY }}
          script: |
            set -e
            cd /var/www/html/CommentSystemMERN/

            git fetch origin deploy-backend
            git reset --hard origin/deploy-backend

            export NVM_DIR="$HOME/.nvm"
            source "$NVM_DIR/nvm.sh"

            cd backend
            npm ci

            pm2 restart CommentSystemMERN || pm2 start npm --name "CommentSystemMERN" -- run start
            pm2 save
